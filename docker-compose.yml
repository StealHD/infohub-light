services:
  horizon-api:
    image: ${INTELISCOPE_IMAGE:-inteliscope-service:local}
    build:
      context: .
      args:
        INTELISCOPE_VERSION: ${INTELISCOPE_VERSION:-1.8.1}
        INTELISCOPE_BUILD_REVISION: ${INTELISCOPE_BUILD_REVISION:-unknown}
        INTELISCOPE_BUILT_AT: ${INTELISCOPE_BUILT_AT:-unknown}
    pull_policy: build
    container_name: horizon-api
    restart: unless-stopped
    ports:
      - "${HORIZON_WEB_BIND:-127.0.0.1}:${HORIZON_WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_WEB_PORT: 8080
      HORIZON_LOG_LEVEL: ${HORIZON_LOG_LEVEL:-INFO}
      HORIZON_LOG_RETENTION_DAYS: ${HORIZON_LOG_RETENTION_DAYS:-30}
      HORIZON_REQUIRE_WORKER_FOR_READINESS: ${HORIZON_REQUIRE_WORKER_FOR_READINESS:-true}
      HORIZON_SQLITE_JOURNAL_MODE: ${HORIZON_SQLITE_JOURNAL_MODE:-WAL}
      HORIZON_APIFY_KEY_POOL_ENABLED: ${HORIZON_APIFY_KEY_POOL_ENABLED:-false}
      HORIZON_REMOTE_MCP_ENABLED: ${HORIZON_REMOTE_MCP_ENABLED:-false}
      HORIZON_REMOTE_MCP_PUBLIC_URL: ${HORIZON_REMOTE_MCP_PUBLIC_URL:-}
      HORIZON_REMOTE_MCP_SUBSCRIPTION_WRITES_ENABLED: ${HORIZON_REMOTE_MCP_SUBSCRIPTION_WRITES_ENABLED:-false}
      HORIZON_OPENCLAW_CHAT_ENABLED: ${HORIZON_OPENCLAW_CHAT_ENABLED:-false}
      HORIZON_OPENCLAW_GATEWAY_DEFAULT_URL: ${HORIZON_OPENCLAW_GATEWAY_DEFAULT_URL:-ws://127.0.0.1:18789}
      HORIZON_OPENCLAW_IMAGE_IO_ENABLED: ${HORIZON_OPENCLAW_IMAGE_IO_ENABLED:-false}
      HORIZON_OPENCLAW_MEDIA_ORIGINS: ${HORIZON_OPENCLAW_MEDIA_ORIGINS:-}
    entrypoint: ["/app/.venv/bin/horizon-api"]
    command: ["--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  horizon-worker:
    image: ${INTELISCOPE_IMAGE:-inteliscope-service:local}
    build:
      context: .
      args:
        INTELISCOPE_VERSION: ${INTELISCOPE_VERSION:-1.8.1}
        INTELISCOPE_BUILD_REVISION: ${INTELISCOPE_BUILD_REVISION:-unknown}
        INTELISCOPE_BUILT_AT: ${INTELISCOPE_BUILT_AT:-unknown}
    pull_policy: build
    container_name: horizon-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_WORKER_ID: ${HORIZON_WORKER_ID:-horizon-worker}
      HORIZON_SCHEDULE_POLL_SECONDS: ${HORIZON_SCHEDULE_POLL_SECONDS:-30}
      HORIZON_WORKER_LEASE_SECONDS: ${HORIZON_WORKER_LEASE_SECONDS:-900}
      HORIZON_WORKER_RETRY_BASE_SECONDS: ${HORIZON_WORKER_RETRY_BASE_SECONDS:-30}
      HORIZON_JOB_RETENTION_DAYS: ${HORIZON_JOB_RETENTION_DAYS:-14}
      HORIZON_LOG_LEVEL: ${HORIZON_LOG_LEVEL:-INFO}
      HORIZON_LOG_RETENTION_DAYS: ${HORIZON_LOG_RETENTION_DAYS:-30}
      HORIZON_MEMBER_RSS_HOST_ALLOWLIST: ${HORIZON_MEMBER_RSS_HOST_ALLOWLIST:-}
      HORIZON_SQLITE_JOURNAL_MODE: ${HORIZON_SQLITE_JOURNAL_MODE:-WAL}
      HORIZON_APIFY_KEY_POOL_ENABLED: ${HORIZON_APIFY_KEY_POOL_ENABLED:-false}
    entrypoint: ["/app/.venv/bin/horizon-worker"]
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/horizon-worker --healthcheck --worker-id $${HORIZON_WORKER_ID:-horizon-worker}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
