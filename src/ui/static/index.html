<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inteliscope</title>
    <link rel="icon" href="data:," />
    <script>window.STATIC_ASSET_VERSION = "20260709-subscription-console";</script>
    <link rel="stylesheet" href="./base.css?v=20260709-subscription-console" />
    <link rel="stylesheet" href="./reader.css?v=20260709-subscription-console" />
    <link rel="stylesheet" href="./config.css?v=20260709-subscription-console" />
    <link rel="stylesheet" href="./media.css?v=20260709-subscription-console" />
    <link rel="stylesheet" href="./article_graph.css?v=20260709-subscription-console" />
    <link rel="stylesheet" href="./subscriptions.css?v=20260709-subscription-console" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>Inteliscope</h1>
          <p id="metaLine">等待数据</p>
        </div>

        <nav class="tabs" aria-label="视图">
          <button class="tab active" type="button" data-view="featured">精选</button>
          <button class="tab" type="button" data-view="all">全部</button>
          <button class="tab" type="button" data-view="readLater">稍后读</button>
          <button class="tab" type="button" data-view="history">历史</button>
          <button class="tab" type="button" data-view="daily">日报</button>
          <button class="tab" type="button" data-view="subscriptions">订阅</button>
          <button class="tab" type="button" data-view="config">配置</button>
        </nav>

        <div class="topbar-actions">
          <input id="searchInput" class="search-input" type="search" placeholder="搜索标题、摘要、标签" />
          <button id="densityToggleBtn" class="icon-button" type="button" title="切换阅读密度">Aa</button>
          <button id="clearFiltersBtn" class="icon-button" type="button" title="清除筛选和本地筛选状态">⌫</button>
          <button id="refreshBtn" class="primary-button" type="button" title="重新读取数据">刷新</button>
        </div>
      </div>
    </header>

    <main id="readerShell" class="reader-shell">
      <aside id="readingQueue" class="reading-queue panel" aria-label="阅读清单">
        <div class="queue-head">
          <div>
            <h2 id="queueTitle">今日精选</h2>
            <p id="queueDescription">按 AI 评分和可行动性排序，适合早晨快速阅读。</p>
          </div>
          <div id="queueStats" class="queue-stats"></div>
          <div class="filter-grid" aria-label="筛选">
            <label class="field">
              <span>最低分</span>
              <span class="range-line">
                <input id="minScoreInput" type="range" min="0" max="10" step="0.5" value="0" />
                <output id="minScoreValue">0</output>
              </span>
            </label>
            <label class="field">
              <span>频道</span>
              <select id="channelSelect">
                <option value="">全部频道</option>
              </select>
            </label>
            <label class="field">
              <span>主题</span>
              <select id="tagSelect">
                <option value="">全部主题</option>
              </select>
            </label>
            <label class="field">
              <span>来源</span>
              <select id="sourceSelect">
                <option value="">全部来源</option>
              </select>
            </label>
            <label class="checkline">
              <input id="favoritesOnly" type="checkbox" />
              <span>只看收藏</span>
            </label>
            <label class="checkline">
              <input id="hideDismissed" type="checkbox" />
              <span>隐藏已忽略</span>
            </label>
            <label class="checkline">
              <input id="unreadFirst" type="checkbox" />
              <span>未读优先</span>
            </label>
          </div>
        </div>
        <div id="itemsList" class="story-list"></div>
      </aside>

      <section id="readerPanel" class="reader-panel panel" aria-label="阅读正文"></section>

      <aside id="contextPanel" class="context-panel" aria-label="阅读上下文"></aside>

      <section id="subscriptionPanel" class="subscription-panel panel hidden" aria-label="订阅控制台">
        <div class="subscription-head">
          <div>
            <h2>订阅</h2>
            <p id="subscriptionSummary">读取中</p>
          </div>
          <div class="subscription-actions">
            <button id="refreshMyFeedBtn" type="button">刷新我的信息流</button>
            <button id="reloadSubscriptionsBtn" type="button">重新读取</button>
          </div>
        </div>
        <div id="subscriptionMessage" class="config-message"></div>
        <div id="subscriptionConsole" class="subscription-console"></div>
      </section>

      <section id="configPanel" class="config-panel panel hidden" aria-label="配置编辑">
        <div class="config-head">
          <div>
            <h2>配置</h2>
            <p id="configPath">读取中</p>
          </div>
          <div class="config-actions">
            <button id="logoutBtn" class="hidden" type="button">退出后台</button>
            <button id="reloadConfigBtn" type="button">重新读取</button>
          </div>
        </div>
        <div id="envStatus" class="env-status"></div>
        <div id="configForms" class="config-forms"></div>
        <div id="configMessage" class="config-message"></div>
      </section>
    </main>

    <button id="articleGraphButton" class="article-graph-fab" type="button" title="查看文章关联分析">关联分析</button>
    <section id="articleGraphPanel" class="article-graph-panel hidden" aria-label="文章关系" aria-live="polite"></section>

    <script src="./state.js?v=20260709-subscription-console"></script>
    <script src="./utils.js?v=20260709-subscription-console"></script>
    <script src="./media.js?v=20260709-subscription-console"></script>
    <script src="./auth.js?v=20260709-subscription-console"></script>
    <script src="./reader.js?v=20260709-subscription-console"></script>
    <script src="./config.js?v=20260709-subscription-console"></script>
    <script src="./subscriptions.js?v=20260709-subscription-console"></script>
    <script src="./article_graph.js?v=20260709-subscription-console"></script>
    <script src="./app.js?v=20260709-subscription-console"></script>
  </body>
</html>
