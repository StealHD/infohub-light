name: infohub-light

services:
  horizon:
    build: .
    pull_policy: build
    container_name: horizon-light-runner
    profiles: ["manual"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
    command: ["--hours", "${HORIZON_FETCH_HOURS:-24}"]

  horizon-web:
    build: .
    pull_policy: build
    container_name: horizon-light-web
    profiles: ["legacy-web"]
    restart: unless-stopped
    ports:
      - "${HORIZON_WEB_BIND:-127.0.0.1}:${HORIZON_WEB_PORT:-8081}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_WEB_PORT: 8080
    entrypoint: ["uv", "run", "horizon-web"]
    command: ["--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  horizon-api:
    image: ${INTELISCOPE_IMAGE:-inteliscope-service:local}
    build:
      context: .
      args:
        INTELISCOPE_VERSION: ${INTELISCOPE_VERSION:-1.6.0}
        INTELISCOPE_BUILD_REVISION: ${INTELISCOPE_BUILD_REVISION:-unknown}
        INTELISCOPE_BUILT_AT: ${INTELISCOPE_BUILT_AT:-unknown}
    pull_policy: build
    container_name: horizon-light-api
    restart: unless-stopped
    ports:
      - "${HORIZON_WEB_BIND:-127.0.0.1}:${HORIZON_WEB_PORT:-8081}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_WEB_PORT: 8080
      HORIZON_SERVICE_UI_VARIANT: ${HORIZON_SERVICE_UI_VARIANT:-react}
      HORIZON_REQUIRE_WORKER_FOR_READINESS: ${HORIZON_REQUIRE_WORKER_FOR_READINESS:-true}
      HORIZON_SQLITE_JOURNAL_MODE: ${HORIZON_SQLITE_JOURNAL_MODE:-DELETE}
      HORIZON_REMOTE_MCP_ENABLED: ${HORIZON_REMOTE_MCP_ENABLED:-false}
      HORIZON_REMOTE_MCP_PUBLIC_URL: ${HORIZON_REMOTE_MCP_PUBLIC_URL:-}
      HORIZON_REMOTE_MCP_SUBSCRIPTION_WRITES_ENABLED: ${HORIZON_REMOTE_MCP_SUBSCRIPTION_WRITES_ENABLED:-false}
    entrypoint: ["uv", "run", "horizon-api"]
    command: ["--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  horizon-worker:
    image: ${INTELISCOPE_IMAGE:-inteliscope-service:local}
    build:
      context: .
      args:
        INTELISCOPE_VERSION: ${INTELISCOPE_VERSION:-1.6.0}
        INTELISCOPE_BUILD_REVISION: ${INTELISCOPE_BUILD_REVISION:-unknown}
        INTELISCOPE_BUILT_AT: ${INTELISCOPE_BUILT_AT:-unknown}
    pull_policy: build
    container_name: horizon-light-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_WORKER_ID: ${HORIZON_WORKER_ID:-horizon-worker}
      HORIZON_SCHEDULE_POLL_SECONDS: ${HORIZON_SCHEDULE_POLL_SECONDS:-30}
      HORIZON_WORKER_LEASE_SECONDS: ${HORIZON_WORKER_LEASE_SECONDS:-900}
      HORIZON_WORKER_RETRY_BASE_SECONDS: ${HORIZON_WORKER_RETRY_BASE_SECONDS:-30}
      HORIZON_JOB_RETENTION_DAYS: ${HORIZON_JOB_RETENTION_DAYS:-14}
      HORIZON_MEMBER_RSS_HOST_ALLOWLIST: ${HORIZON_MEMBER_RSS_HOST_ALLOWLIST:-}
      HORIZON_SQLITE_JOURNAL_MODE: ${HORIZON_SQLITE_JOURNAL_MODE:-DELETE}
    entrypoint: ["uv", "run", "horizon-worker"]
    healthcheck:
      test: ["CMD-SHELL", "uv run horizon-worker --healthcheck --worker-id $${HORIZON_WORKER_ID:-horizon-worker}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  horizon-scheduler:
    build: .
    pull_policy: build
    container_name: horizon-light-scheduler
    profiles: ["scheduler"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      TZ: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_TIMEZONE: ${HORIZON_TIMEZONE:-Asia/Shanghai}
      HORIZON_DAILY_TIME: ${HORIZON_DAILY_TIME:-08:30}
      HORIZON_FETCH_HOURS: ${HORIZON_FETCH_HOURS:-24}
      HORIZON_RUN_ON_START: ${HORIZON_RUN_ON_START:-false}
      HORIZON_POLL_ENABLED: ${HORIZON_POLL_ENABLED:-false}
      HORIZON_POLL_INTERVAL_MINUTES: ${HORIZON_POLL_INTERVAL_MINUTES:-30}
      HORIZON_POLL_FETCH_HOURS: ${HORIZON_POLL_FETCH_HOURS:-2}
    entrypoint: ["uv", "run", "horizon-scheduler"]
