# Loaded from nginx.conf's http context via /etc/nginx/conf.d/*.conf.
limit_req_zone $binary_remote_addr zone=inteliscope_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=inteliscope_mcp:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=inteliscope_mcp_connections:10m;

# The API returns its generated request ID in the WebSocket handshake. Logging
# that ID with safe timing and status fields correlates proxy and application
# diagnostics without recording cookies, query strings, or message content.
log_format inteliscope_websocket
    'time=$time_iso8601 request_id=$upstream_http_x_request_id '
    'status=$status upstream_status=$upstream_status '
    'request_time=$request_time upstream_response_time=$upstream_response_time';
