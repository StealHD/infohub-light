# Nginx reverse proxy for Inteliscope with Basic Auth.
#
# Install:
#   sudo cp deploy/nginx/inteliscope-basic-auth.conf /etc/nginx/sites-available/inteliscope
#   sudo ln -sf /etc/nginx/sites-available/inteliscope /etc/nginx/sites-enabled/inteliscope
#   sudo nginx -t && sudo systemctl reload nginx
#
# VPS target: rb.jiefs.top -> 127.0.0.1:8080.

server {
    listen 80;
    server_name rb.jiefs.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rb.jiefs.top;

    ssl_certificate /root/cert-CF/rb.jiefs.top/fullchain.pem;
    ssl_certificate_key /root/cert-CF/rb.jiefs.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/auth/login {
        auth_basic "Inteliscope";
        auth_basic_user_file /etc/nginx/.htpasswd_inteliscope;
        limit_req zone=inteliscope_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Remote MCP uses its own per-user opaque Bearer token. Do not challenge
    # OpenClaw with the browser-facing Basic Auth layer.
    location = /mcp {
        auth_basic off;
        client_max_body_size 256k;
        limit_req zone=inteliscope_mcp burst=10 nodelay;
        limit_req_status 429;
        limit_conn inteliscope_mcp_connections 8;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        auth_basic "Inteliscope";
        auth_basic_user_file /etc/nginx/.htpasswd_inteliscope;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
