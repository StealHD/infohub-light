# Nginx reverse proxy for Inteliscope with Basic Auth.
#
# Install:
#   sudo cp deploy/nginx/inteliscope-basic-auth.conf /etc/nginx/sites-available/inteliscope
#   sudo ln -sf /etc/nginx/sites-available/inteliscope /etc/nginx/sites-enabled/inteliscope
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace radar.example.com and the certificate paths before using HTTPS.

server {
    listen 80;
    server_name radar.example.com;

    auth_basic "Inteliscope";
    auth_basic_user_file /etc/nginx/.htpasswd_inteliscope;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

