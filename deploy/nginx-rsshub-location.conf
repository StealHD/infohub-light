# Include this file inside the existing HTTPS server for rb.jiefs.top.
# RSSHub still binds only to host loopback; Nginx is its public TLS boundary.
location = /rsshub {
    return 308 /rsshub/;
}

location /rsshub/ {
    access_log off;
    client_max_body_size 64k;
    limit_req zone=inteliscope_mcp burst=10 nodelay;
    limit_req_status 429;
    limit_conn inteliscope_mcp_connections 8;

    proxy_pass http://127.0.0.1:1200/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /rsshub;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
